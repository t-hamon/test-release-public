name: Test FastAPI with Docker and PostgreSQL

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test-api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: movies_db
        ports:
          - 5432:5432
        volumes:
          - ./data:/docker-entrypoint-initdb.d
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Debug: Check if SQL and CSV exist
        run: |
          echo "Listing ./data contents:"
          ls -l ./data
          echo "Printing init.sql:"
          cat ./data/init.sql

      - name: Build Docker image
        run: docker build -t my-fastapi-app .

      - name: Run API container (detached)
        run: |
          docker run -d --name fastapi-container --network host my-fastapi-app
          sleep 5  # wait for app to start

      - name: Test API
        run: curl http://localhost:8000/docs

      - name: Show Postgres logs (if anything failed)
        if: failure()
        run: docker logs $(docker ps -aqf "ancestor=postgres")
