name: Test FastAPI avec Docker et PostgreSQL

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test-api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: movies_db
        ports:
          - 5432:5432
        volumes:
          - ./data:/docker-entrypoint-initdb.d
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx pytest

      - name: "Debug: Check data contents"
        run: |
          echo "Listing ./data contents:"
          ls -l ./data
          echo "Printing init.sql:"
          cat ./data/init.sql

      - name: Build Docker image
        run: docker build -t my-fastapi-app .

      - name: Run API container
        run: |
          docker run -d \
            --name fastapi-container \
            --network host \
            -e DATABASE_URL="postgresql://postgres:root@localhost:5432/movies_db" \
            my-fastapi-app
          sleep 5

      - name: Health check
        run: curl http://localhost:8000/health

      - name: Run pytest
