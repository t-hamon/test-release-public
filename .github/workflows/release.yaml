name: Release

on:
  push:
    branches:
      - test-release
    tags:
      - 'v*'

jobs:
  release:
    name: Create release and build
    runs-on: ubuntu-latest

    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Clean previous release
      run: rm -rf release

    - name: Generate Changelog
      run: |
        echo "## Changes in this release" > RELEASE.md
        git log -1 --pretty=format:"- %s" >> RELEASE.md

    - name: Archive Release Files
      run: |
        mkdir release
        cp -r src Dockerfile requirements.txt release/
        cp RELEASE.md release/

