version: '3.8'

services:
  # PostgreSQL
  my-postgres:
    image: postgres:14
    container_name: my-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: movies_db                   # <-- Database created automatically
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./movies_cleaned.csv:/docker-entrypoint-initdb.d/movies_cleaned.csv:ro
    ports:
      - "5432:5432"

  # Airflow DB initializer
  airflow-init:
    image: apache/airflow:2.9.0-python3.10
    container_name: airflow-init
    depends_on:
      - my-postgres
    environment:
      AIRFLOW__CORE__FERNET_KEY: 3pfbKxdYFNgKcSJwVihnMse7VYUfQFIkjdjqq7Ckyf8==
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:password@my-postgres:5432/movies_db
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init && \
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password mypassword

  # Airflow Scheduler
  airflow-scheduler:
    image: apache/airflow:2.9.0-python3.10
    container_name: airflow-scheduler
    command: scheduler
    environment:
      AIRFLOW__CORE__FERNET_KEY: 3pfbKxdYFNgKcSJwVihnMse7VYUfQFIkjdjqq7Ckyf8==
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:password@my-postgres:5432/movies_db
    depends_on:
      - my-postgres
    volumes:
      - ./airflow/dags:/opt/airflow/dags


  # Airflow Webserver
  airflow-webserver:
    image: apache/airflow:2.9.0-python3.10
    container_name: airflow-webserver
    command: webserver
    environment:
      AIRFLOW__CORE__FERNET_KEY: 3pfbKxdYFNgKcSJwVihnMse7VYUfQFIkjdjqq7Ckyf8==
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:password@my-postgres:5432/movies_db
      AIRFLOW__WEBSERVER__AUTHENTICATE: "True"
      AIRFLOW__WEBSERVER__AUTH_BACKEND: airflow.www.auth.backend.password_auth
    ports:
      - "8080:8080"
    depends_on:
      - airflow-scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags

  # MLflow Tracking Server
  mlflow-server:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    container_name: mlflow-server
    command: mlflow server --host 0.0.0.0 --port 5000
    ports:
      - "5001:5000"

# FastAPI Application
  app:
    build: .
    container_name: reco-app
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:password@my-postgres:5432/movies_db
      MODEL_DIR: /app/src/models
    ports:
      - "8000:8000"
    volumes:
      - .:/app                            # Mount the whole project (including models)
    depends_on:
      - my-postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      retries: 3
      timeout: 10s

volumes:
  pgdata:
    driver: local

